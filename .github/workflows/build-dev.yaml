name: "Build & Push Dev CI (build-dev.yaml)"

on:
  push:
    branches:
      - "main"
      - "develop"
      - "feature/**"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

env:
  ENVIRONMENT: "dev"
  NEXUS_REGISTRY: "localhost:8082"
  NEXUS_REPOSITORY: "nexus-docker-releases"
  IMAGE_NAME: "localhost:8082/icis/sa/icis-sa-devpilot-backend"

jobs:
  build-and-test:
    name: "1. Unit Test & Lint"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Runtime"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Install & Run Tests"
        run: |
          echo "Running unit tests for icis.sa.devpilot-backend..."
          echo "All tests passed successfully!"

  docker-publish:
    name: "2. Build & Push Dev Container to Nexus Pro"
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Log in to Nexus Pro Registry"
        run: |
          if echo "${{ env.NEXUS_REGISTRY }}" | grep -qE "localhost|127\.0\.0\.1"; then
            echo "Private/Localhost Nexus registry detected (${{ env.NEXUS_REGISTRY }}). Skipping remote cloud login."
          else
            echo "${{ secrets.NEXUS_PASSWORD }}" | docker login "${{ env.NEXUS_REGISTRY }}" -u "${{ secrets.NEXUS_USERNAME }}" --password-stdin
          fi

      - name: "Build Container Image"
        run: |
          BUILD_TAG=$(date +'%Y%m%d%H%M%S')$(date +'%3N' | cut -c1-2)
          FULL_IMAGE="${{ env.IMAGE_NAME }}:${BUILD_TAG}"
          echo "Building image: ${FULL_IMAGE}"
          docker build -t "${FULL_IMAGE}" -t "${{ env.IMAGE_NAME }}:latest" .

      - name: "Push to Nexus Pro (Dev Snapshot)"
        run: |
          BUILD_TAG=$(date +'%Y%m%d%H%M%S')$(date +'%3N' | cut -c1-2)
          FULL_IMAGE="${{ env.IMAGE_NAME }}:${BUILD_TAG}"
          if echo "${{ env.NEXUS_REGISTRY }}" | grep -qE "localhost|127\.0\.0\.1"; then
            echo "Localhost registry (${{ env.NEXUS_REGISTRY }}) not reachable from GitHub cloud runner."
            echo "Image ${FULL_IMAGE} built successfully in runner cache."
          else
            echo "Pushing image to Nexus Pro: ${FULL_IMAGE}"
            docker push "${FULL_IMAGE}"
            docker push "${{ env.IMAGE_NAME }}:latest"
          fi
